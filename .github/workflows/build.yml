name: Build Android APK (Otomatis)

on:
  workflow_dispatch:

jobs:
  build:
    name: Ekstrak dan Kompilasi APK
    runs-on: ubuntu-latest

    steps:
      - name: Ekstrak Sumber Proyek Lengkap
        run: |
          cat << 'EOF' | base64 -d > source.zip

EOF
          unzip -o source.zip -d .
          ls -la

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pasang Gradle 8.9 (Wajib untuk AGP 8.7.3)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Buat Gradle Wrapper 8.9
        run: gradle wrapper --gradle-version 8.9

      - name: Izin Eksekusi Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Simpan APK Siap Pakai
        uses: actions/upload-artifact@v4
        with:
          name: Bluetooth2WayDSP-APK
          path: app/build/outputs/apk/debug/*.apk
          
